name: Prepare PCP goal tool schema
on:
  push:
    branches: [feature/pcp-isolated-conversion-goals]
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pcp-isolated-conversion-goals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . google-genai black pytest
      - name: Format and regenerate tool schema
        run: |
          python -m black -l 80 ads_mcp/tools/targeting.py tests/test_targeting_guardrails.py
          python -m tests.smoke.generate_golden
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads_mcp/tools/targeting.py tests/test_targeting_guardrails.py tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Format PCP conversion tool and refresh tool schema"
            git push
          fi
      - name: Offline safety tests
        run: |
          python -m pytest -q tests/test_targeting_guardrails.py
          python -m compileall -q ads_mcp

name: Guarded Google Ads MCP checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Compile all Python modules
        run: python -m compileall -q ads_mcp
      - name: Run offline guardrail tests
        run: python -m pytest -q tests/test_management_guardrails.py tests/test_targeting_guardrails.py

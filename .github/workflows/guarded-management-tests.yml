name: Guarded Google Ads MCP checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest google-genai black
      - name: Update target tools and smoke schema
        run: |
          python -m black -l 80 ads_mcp/tools/targeting.py tests/test_targeting_guardrails.py
          python -m tests.smoke.generate_golden
      - name: Commit generated changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads_mcp/tools/targeting.py tests/test_targeting_guardrails.py tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Format target tools and refresh schema snapshot"
            git push
          fi
      - name: Offline tests
        run: |
          python -m pytest -q tests/test_targeting_guardrails.py
          python -m compileall -q ads_mcp

name: Guarded Google Ads MCP checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest google-genai
      - name: Regenerate tool schema reference
        run: python -m tests.smoke.generate_golden
      - name: Commit updated tool schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh guarded creative tool schema reference"
            git push
          fi
      - name: Run offline guardrail tests
        run: python -m pytest -q tests/test_management_guardrails.py

name: Guarded Google Ads MCP checks
on:
  push:
    branches: [feature/guarded-campaign-management]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  safe-checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, formatter and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest black google-genai
      - name: Format and regenerate tool schema reference
        if: github.event_name == 'push'
        run: |
          python -m black -l 80 ads_mcp/tools/campaigns.py ads_mcp/tools/management.py ads_mcp/tools/creative.py tests/test_management_guardrails.py
          python -m tests.smoke.generate_golden
      - name: Commit reference and formatting changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads_mcp/tools/campaigns.py ads_mcp/tools/management.py ads_mcp/tools/creative.py tests/test_management_guardrails.py tests/smoke/golden_tools_list.json
          if ! git diff --cached --quiet; then
            git commit -m "Format guarded management tools and update smoke schema"
            git push
          fi
      - name: Compile all Python modules
        run: python -m compileall -q ads_mcp
      - name: Run offline guardrail tests
        run: python -m pytest -q tests/test_management_guardrails.py
